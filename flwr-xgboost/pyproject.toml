# =====================================================================
# XGBoost Federado para previsão de chuva na Austrália
# Suporta as estratégias Bagging e Cyclic
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flwr-xgboost"
version = "1.0.0"
description = "Federated XGBoost for Australian Weather Rain Prediction (Bagging + Cyclic)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.22.0",
    "flwr-datasets>=0.5.0",
    "xgboost>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "Antonio"

[tool.flwr.app.components]
serverapp = "federated_xgboost.server_app:app"
clientapp = "federated_xgboost.client_app:app"

# ===== ESTRATÉGIA DE TREINO =====
# Escolha: "bagging" ou "cyclic"
[tool.flwr.app.config]
strategy = "cyclic"  # Options: "bagging" or "cyclic"
# Opcional: permite que o run-config especifique o diretório de saída dos modelos (relativo ou absoluto)
models_dir = "models"

# ===== CYCLIC STRATEGY CONFIGURATION =====
# Sequential training: one client per round, each adds trees incrementally
# Rationale: 44 clients × 5 trees = 220 trees
num-server-rounds-cyclic = 44    # 1 round per client (44 locations, fixed by architecture)
local-epochs-cyclic = 5          # 5 trees per client (total: 44×5 = 220 trees)

# ===== CONFIGURAÇÃO DA ESTRATÉGIA BAGGING =====
# Treino paralelo: todos os clientes treinam simultaneamente e depois ocorre agregação
# Justificativa: partições de dados fixas → usar apenas 1 rodada para evitar sobreajuste
# Com partições fixas, múltiplas rodadas re-treinariam sobre os mesmos dados (memorização)
# Bagging puro: 1 rodada × 44 clientes × 5 árvores = 220 árvores (equivalente ao cyclic)
num-server-rounds-bagging = 1    # Only 1 round (pure bagging, no overfitting)
local-epochs-bagging = 5         # 5 trees per client (total: 44×5 = 220 trees)

# ===== CONFIGURAÇÃO COMPARTILHADA =====
fraction-train = 1.0        # Bagging: % of clients per round; Cyclic: ignored (always 1 client)
fraction-evaluate = 1.0     # % of clients for evaluation

# ===== CONFIGURAÇÃO DE DADOS =====
keep-location = false       # false: descarta Location (padrão federado)
                           # true: codifica Location como feature

# ===== HIPERPARÂMETROS XGBOOST =====
# Baseados nos melhores hiperparâmetros do treinamento centralizado
# Observação: estes valores são sincronizados automaticamente via sync_hyperparameters.ps1
params.objective = "binary:logistic"
params.eta = 0.055965356054258765
params.max-depth = 6
params.min-child-weight = 7
params.gamma = 0.12023214745973859
params.subsample = 0.7058191234594904
params.colsample-bytree = 0.8306090261541431
params.eval-metric = "aucpr"
params.scale-pos-weight = 3.5138761991777065
params.nthread = 16
params.tree-method = "hist"
params.reg-alpha = 4.16783955080239E-07
params.reg-lambda = 7.28837310413845E-07

# ===== FEDERATION CONFIGURATION =====

